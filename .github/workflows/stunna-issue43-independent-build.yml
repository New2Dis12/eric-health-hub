name: Independent build of Stunna PR 44
on:
  push:
    branches:
      - verification/issue-43
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout the published pull request commit
        uses: actions/checkout@v4
        with:
          ref: 3e3440436ca12fbb8c97ece42d8df607a6ea4d1f
          persist-credentials: false
      - name: Verify the checkout identity
        run: |
          test "$(git rev-parse HEAD)" = '3e3440436ca12fbb8c97ece42d8df607a6ea4d1f'
          test "$(git rev-parse HEAD^{tree})" = '9c3a6e03669765b9c782ec82af50dbfe81b5ed09'
          git log -1 --format='%H %T'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned build dependencies
        run: |
          npm install --global pnpm@12.3.4
          pnpm install --frozen-lockfile
      - name: Run the optimized Production build of the exact PR head
        run: pnpm build
