name: Stunna Issue 61 synthetic validation

on:
  push:
    branches:
      - work/issue-61
      - fix/mobile-rpe-spacing
      - work/issue-64

permissions:
  contents: read

concurrency:
  group: stunna-issue-61-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.3.4
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Application and player tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Optimized local build only
        run: pnpm build
      - name: Synthetic Garmin browser to PostgreSQL flow at 375px and 390px
        run: SCREENSHOT_DIR="$RUNNER_TEMP/device-results" CHROMIUM_BIN="$(command -v google-chrome)" node tests/source-evidence-browser.mjs
      - name: Preserve synthetic mobile screenshots
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-device-results
          path: ${{ runner.temp }}/device-results/*.png
      - name: Player acceptance at 402px, 390px and 375px
        run: SCREENSHOT_DIR="$RUNNER_TEMP/player" CHROMIUM_BIN="$(command -v google-chrome)" node tests/player-mobile-browser.mjs
      - name: Preserve player screenshots
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-workout-player
          path: ${{ runner.temp }}/player/*.png
      - name: Workflow regression suite
        run: node --test tests/workflow/*.test.mjs
      - name: Whitespace and deployment exclusion
        run: |
          git diff --check HEAD~1 HEAD
          node -e 'const c=require("./vercel.json"); if(c.git.deploymentEnabled[process.env.GITHUB_REF_NAME] !== false) process.exit(1)'
