name: Exact-head build for Stunna scope diagnostic
on:
  push:
    branches:
      - verification/issue-45
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout the exact diagnostic commit
        uses: actions/checkout@v4
        with:
          ref: d3618aff4a2b6cbefa71e00220d02e6dd94e9a1e
          persist-credentials: false
      - name: Verify the checkout identity
        run: |
          test "$(git rev-parse HEAD)" = 'd3618aff4a2b6cbefa71e00220d02e6dd94e9a1e'
          test "$(git rev-parse HEAD^{tree})" = '64373eb9950c434df2fe25c0389c3c3b4a20dceb'
          git log -1 --format='%H %T'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frozen dependencies
        run: |
          npm install --global pnpm@12.3.4
          pnpm install --frozen-lockfile
      - name: Test the application, UI and workflow
        run: |
          pnpm test
          pnpm typecheck
          node --test tests/workflow/*.test.mjs
      - name: Build the exact diagnostic commit
        run: pnpm build
